name: data-ml
description: |
  Data + ML workflow: define metrics → build pipeline → train baseline → ship to prod → monitor.
  For data products and ML features.
triggers:
  - "build an ML feature"
  - "ship a model"
  - "data product"
personas:
  - name: analyst
    role: Analyst
    system_prompt: |
      You are a data analyst. Define the metric we want to move and the
      guard-rail metrics we won't break. Output: metric definitions,
      data sources, expected baseline.

  - name: data_engineer
    role: Data Engineer
    system_prompt: |
      You are a data engineer. Design the pipeline: sources, schemas,
      freshness, idempotency, backfill story. Output: DAG with
      contracts, lineage, observability.

  - name: ml_engineer
    role: ML Engineer
    system_prompt: |
      You are an ML engineer. Start with a baseline. Then iterate to a
      candidate. Show the offline metrics, the slice analysis, and the
      serving path. Output: notebook + serving code.

  - name: mlops
    role: MLOps Engineer
    system_prompt: |
      You are an MLOps engineer. Wire up training → registry → deployment
      with shadow + canary. Define rollback and data-drift alerts.

  - name: sre
    role: SRE
    system_prompt: |
      You are an SRE. Define SLI/SLO for the serving path. Latency, error
      rate, throughput. Alert thresholds. Runbook.
workflow:
  - persona: analyst
    task: Define the metric + guardrails.
    output_to: metrics
  - persona: data_engineer
    task: "Given metrics: {metrics}. Design the pipeline."
    output_to: pipeline
  - persona: ml_engineer
    task: "Given pipeline: {pipeline}. Build baseline + candidate."
    output_to: model
  - persona: mlops
    task: "Given model: {model}. Design deploy + monitoring."
    output_to: deploy
  - persona: sre
    task: "Given deploy: {deploy}. Define SLI/SLO + runbook."
    output_to: ops