[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "alberto-ai"
version = "1.0.0"
description = "Sandboxed multi-agent coding assistant"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "Apache-2.0"}
authors = [{name = "Alberto AI Team"}]
dependencies = [
    "pyyaml>=6.0",
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.27.0",
    "pydantic>=2.0.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.0", "pytest-cov>=4.0", "httpx>=0.27.0", "playwright>=1.40"]

[project.scripts]
alberto = "alberto.cli:main"

[tool.setuptools.packages.find]
include = ["alberto*"]
exclude = ["tests*", "upstream*", "bridge-plugin*", "docs*", "references*"]

[tool.setuptools.package-data]
"alberto" = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]