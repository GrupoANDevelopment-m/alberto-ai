# agentgateway - Basic Configuration
# Two agents sharing a single Anthropic provider

gateway:
  port: 8080

agents:
  researcher:
    model: claude-sonnet-4-20250514
    provider: anthropic
    budget:
      max_cost_per_hour: 5.00
    rate_limit: 100/min

  writer:
    model: claude-haiku-4-5-20251001
    provider: anthropic
    budget:
      max_cost_per_hour: 1.00
    rate_limit: 50/min

dashboard:
  port: 4040
