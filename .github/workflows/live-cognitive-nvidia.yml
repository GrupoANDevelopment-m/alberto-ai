name: Live Cognitive Tests (NVIDIA)

on:
  push:
    branches: [fix/chat-default-task-routing]
    paths:
      - "alberto/**"
      - "tests/**"
      - "scripts/live_cognitive_smoke.py"
      - ".github/workflows/live-cognitive-nvidia.yml"
  workflow_dispatch:

jobs:
  live-cognitive:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
      - name: Run real NVIDIA cognitive chat tests
        env:
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
          NVIDIA_API_KEY_FALLBACK: ${{ secrets.NVIDIA_API_KEY_FALLBACK }}
        run: |
          test -n "$NVIDIA_API_KEY"
          test -n "$NVIDIA_API_KEY_FALLBACK"
          python scripts/live_cognitive_smoke.py
