name: CI

# Alberto AI v1.8 CI pipeline (closes G-O1)
on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

# Keep only the newest validation run for this branch/PR to avoid stale runs
# consuming runners after a rapid series of hardening commits.
concurrency:
  group: alberto-ai-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11"]
    steps:
      - uses: actions/checkout@v4

      - name: Install system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y poppler-utils

      - name: Setup Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install Python deps
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install -e . --no-deps
          python -m pip check

      - name: Compile-check Python sources
        run: |
          python -m compileall -q alberto bin tests

      - name: Verify behavioral suites are included in coverage
        run: |
          python - <<'PY'
          from pathlib import Path

          workflow = Path(".github/workflows/ci.yml").read_text(encoding="utf-8")
          required = (
              "tests/test_cli_conversation_contracts.py",
              "tests/test_hermes_dispatch_contracts.py",
              "tests/test_cli_smoke.py",
              "tests/test_mimo_app_creation.py",
              "tests/test_function_caller_hardening.py",
              "tests/test_agent_core_hardening.py",
          )
          for test_path in required:
              count = workflow.count(test_path)
              if count < 2:
                  raise SystemExit(
                      f"{test_path} must appear in both regression and coverage commands; found {count}"
                  )
          PY

      - name: Run offline security and regression tests
        env:
          NVIDIA_API_KEY: "test-key-disabled"
          ALBERTO_OFFLINE: "1"
        run: |
          python -m pytest tests/test_v15_unit.py tests/test_v15_components.py tests/test_v17_security.py tests/test_file_read_security.py tests/test_nemoclaw_path_redaction.py tests/test_learner_security.py tests/test_self_healing_control.py tests/test_self_healing_safety.py tests/test_multiedit_security.py tests/test_alberto_cli_tool_security.py tests/test_v184_sandbox.py tests/test_security_policy_fail_closed.py tests/test_sandbox_config.py tests/test_skill_execution_security.py tests/test_skill_engine_security.py tests/test_conversation_store_hardening.py tests/test_webfetch_ssrf.py tests/test_shell_sandbox_routing.py tests/test_hermes_sandbox_routing.py tests/test_function_caller_hardening.py tests/test_integration_adapters.py tests/test_agent_core_hardening.py tests/test_smart_router_hardening.py tests/test_extensions_hardening.py tests/test_app_tester_hardening.py tests/test_app_creator_security.py tests/test_mimo_app_creation.py tests/test_mimo_engine_hardening.py tests/test_mcp.py tests/test_server_production_security.py tests/test_server_launcher_security.py tests/test_benchmark_alberto.py tests/test_no_embedded_credentials.py -v --tb=short

      - name: Run CLI smoke tests
        run: |
          alberto --help
          alberto-serve --help
          python -m pytest tests/test_cli_smoke.py -v --tb=short

      - name: Run additional offline regression tests
        env:
          ALBERTO_OFFLINE: "1"
          NVIDIA_API_KEY: ""
          OPENAI_API_KEY: ""
        run: |
          python -m pytest tests/test_meta.py tests/test_v15_real.py tests/test_v182_hermes_tools.py tests/test_v18_real_tools.py tests/test_v18_upstream_bridge.py tests/test_v18_workflows.py tests/test_v183_crewai.py tests/test_runtime_deep_contracts.py tests/test_cli_conversation_contracts.py tests/test_hermes_dispatch_contracts.py tests/test_smoke.py -m "not network and not llm and not slow" -v --tb=short

      - name: Generate coverage report
        env:
          ALBERTO_OFFLINE: "1"
          NVIDIA_API_KEY: ""
          OPENAI_API_KEY: ""
        run: |
          python -m pytest tests/test_v15_unit.py tests/test_v15_components.py tests/test_v17_security.py tests/test_file_read_security.py tests/test_nemoclaw_path_redaction.py tests/test_learner_security.py tests/test_self_healing_control.py tests/test_self_healing_safety.py tests/test_multiedit_security.py tests/test_alberto_cli_tool_security.py tests/test_v184_sandbox.py tests/test_security_policy_fail_closed.py tests/test_sandbox_config.py tests/test_skill_execution_security.py tests/test_skill_engine_security.py tests/test_conversation_store_hardening.py tests/test_webfetch_ssrf.py tests/test_shell_sandbox_routing.py tests/test_hermes_sandbox_routing.py tests/test_function_caller_hardening.py tests/test_integration_adapters.py tests/test_agent_core_hardening.py tests/test_smart_router_hardening.py tests/test_extensions_hardening.py tests/test_app_tester_hardening.py tests/test_app_creator_security.py tests/test_mimo_app_creation.py tests/test_mimo_engine_hardening.py tests/test_mcp.py tests/test_server_production_security.py tests/test_server_launcher_security.py tests/test_benchmark_alberto.py tests/test_no_embedded_credentials.py tests/test_cli_smoke.py tests/test_meta.py tests/test_v15_real.py tests/test_v182_hermes_tools.py tests/test_v18_real_tools.py tests/test_v18_upstream_bridge.py tests/test_v18_workflows.py tests/test_v183_crewai.py tests/test_runtime_deep_contracts.py tests/test_cli_conversation_contracts.py tests/test_hermes_dispatch_contracts.py tests/test_smoke.py \
            -m "not network and not llm and not slow" --cov=alberto --cov-branch --cov-report=term-missing:skip-covered --cov-report=xml

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v3
        with:
          files: ./coverage.xml
          fail_ci_if_error: false


  live-agent-conversation:
    # Run manually only: never expose provider credentials to pull-request code.
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install -e . --no-deps
      - name: Require configured live provider secret
        env:
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
        run: |
          if [ -z "$NVIDIA_API_KEY" ]; then
            echo "::error::Configure the repository Actions secret NVIDIA_API_KEY before running live integration tests."
            exit 1
          fi
      - name: Run real Alberto conversation and tool execution
        env:
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
          ALBERTO_LIVE_TESTS: "1"
          ALBERTO_LIVE_MODEL_ID: ${{ vars.ALBERTO_LIVE_MODEL_ID || 'meta/llama-3.3-70b-instruct' }}
        run: python -m pytest -q -s tests/test_live_agent_conversation.py
