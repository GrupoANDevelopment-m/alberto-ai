name: CI

# Alberto AI v1.8 CI pipeline (closes G-O1)
on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11"]
    steps:
      - uses: actions/checkout@v4

      - name: Install system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y poppler-utils

      - name: Setup Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install Python deps
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install -e . --no-deps

      - name: Run smoke tests (offline)
        env:
          NVIDIA_API_KEY: "test-key-disabled"
          ALBERTO_OFFLINE: "1"
        run: |
          python -m pytest tests/test_v15_unit.py tests/test_v15_components.py tests/test_v17_security.py tests/test_file_read_security.py tests/test_self_healing_control.py tests/test_self_healing_safety.py tests/test_multiedit_security.py tests/test_alberto_cli_tool_security.py tests/test_v184_sandbox.py tests/test_security_policy_fail_closed.py tests/test_sandbox_config.py tests/test_skill_execution_security.py tests/test_webfetch_ssrf.py tests/test_shell_sandbox_routing.py tests/test_hermes_sandbox_routing.py tests/test_benchmark_alberto.py tests/test_no_embedded_credentials.py -v --tb=short

      - name: Run CLI smoke tests
        run: |
          alberto --help
          alberto-serve --help
          python -m pytest tests/test_cli_smoke.py -v --tb=short

      - name: Run additional offline regression tests
        env:
          ALBERTO_OFFLINE: "1"
          NVIDIA_API_KEY: ""
          OPENAI_API_KEY: ""
        run: |
          python -m pytest tests/test_meta.py tests/test_v15_real.py tests/test_v182_hermes_tools.py tests/test_v18_real_tools.py tests/test_v18_upstream_bridge.py tests/test_v18_workflows.py tests/test_v183_crewai.py -m "not network and not llm and not slow" -v --tb=short

      - name: Generate coverage report
        env:
          ALBERTO_OFFLINE: "1"
          NVIDIA_API_KEY: ""
          OPENAI_API_KEY: ""
        run: |
          python -m pytest tests/test_v15_unit.py tests/test_v15_components.py tests/test_v17_security.py tests/test_file_read_security.py tests/test_self_healing_control.py tests/test_self_healing_safety.py tests/test_multiedit_security.py tests/test_alberto_cli_tool_security.py tests/test_v184_sandbox.py tests/test_security_policy_fail_closed.py tests/test_sandbox_config.py tests/test_skill_execution_security.py tests/test_webfetch_ssrf.py tests/test_shell_sandbox_routing.py tests/test_hermes_sandbox_routing.py tests/test_benchmark_alberto.py tests/test_no_embedded_credentials.py tests/test_cli_smoke.py tests/test_meta.py tests/test_v15_real.py tests/test_v182_hermes_tools.py tests/test_v18_real_tools.py tests/test_v18_upstream_bridge.py tests/test_v18_workflows.py tests/test_v183_crewai.py \
            -m "not network and not llm and not slow" --cov=alberto --cov-branch --cov-report=term-missing:skip-covered --cov-report=xml

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v3
        with:
          files: ./coverage.xml
          fail_ci_if_error: false
