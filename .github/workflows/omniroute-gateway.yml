name: OmniRoute Gateway Validation

on:
  push:
    branches: [audit/omniroute-gateway-validation]
  pull_request:
    branches: [main, master, audit/integrated-hardening]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: omniroute-gateway-${{ github.ref }}
  cancel-in-progress: true

jobs:
  install-and-healthcheck:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Install OmniRoute CLI
        run: |
          node --version
          npm --version
          npm install --global omniroute
          omniroute --version
          omniroute --help

      - name: Start local gateway and wait for readiness
        shell: bash
        run: |
          set -euo pipefail
          omniroute serve --no-open --port 20128 --no-recovery > "$RUNNER_TEMP/omniroute.log" 2>&1 &
          gateway_pid=$!
          cleanup() {
            kill "$gateway_pid" 2>/dev/null || true
            if command -v omniroute >/dev/null 2>&1; then
              omniroute stop >/dev/null 2>&1 || true
            fi
          }
          trap cleanup EXIT

          ready=0
          for attempt in $(seq 1 90); do
            if curl --silent --show-error --fail http://127.0.0.1:20128/healthz > "$RUNNER_TEMP/omniroute-health.txt"; then
              ready=1
              break
            fi
            if ! kill -0 "$gateway_pid" 2>/dev/null; then
              echo "OmniRoute process exited before becoming healthy."
              cat "$RUNNER_TEMP/omniroute.log"
              exit 1
            fi
            sleep 2
          done

          if [ "$ready" -ne 1 ]; then
            echo "OmniRoute did not become healthy within 180 seconds."
            cat "$RUNNER_TEMP/omniroute.log"
            exit 1
          fi

          cat "$RUNNER_TEMP/omniroute-health.txt"
          python - "$RUNNER_TEMP/omniroute-health.txt" <<'PY'
          import json
          import sys
          from pathlib import Path

          raw = Path(sys.argv[1]).read_text(encoding="utf-8").strip()
          try:
              payload = json.loads(raw)
          except json.JSONDecodeError:
              payload = raw

          healthy = payload == "ok" or (
              isinstance(payload, dict) and payload.get("status") == "ok"
          )
          if not healthy:
              raise SystemExit(f"Unexpected OmniRoute health response: {payload!r}")
          print("OmniRoute health endpoint reports healthy status")
          PY

      - name: Inspect configured providers, model catalog, and API surface
        shell: bash
        run: |
          set -uo pipefail
          export OMNIROUTE_BASE_URL="http://127.0.0.1:20128"

          run_check() {
            label="$1"
            shift
            output="$RUNNER_TEMP/omniroute-check-$(echo "$label" | tr ' /' '--').txt"
            echo "=== $label ==="
            if "$@" > "$output" 2>&1; then rc=0; else rc=$?; fi
            cat "$output"
            echo "exit_code=$rc"
            return 0
          }

          run_check "Provider list help" omniroute providers list --help
          run_check "Available provider catalog" omniroute providers available
          run_check "Configured provider connections" omniroute providers list
          run_check "Provider connection validation" omniroute providers validate
          run_check "Model catalog (JSON)" omniroute models --json
          run_check "Gateway status" omniroute status --verbose
          run_check "Gateway diagnostics (JSON)" omniroute doctor --json
          echo "=== OpenAI-compatible models endpoint (no auth header) ==="
          if curl --silent --show-error --max-time 15 -i \
            http://127.0.0.1:20128/v1/models; then
            echo "models_endpoint_curl_exit_code=0"
          else
            echo "models_endpoint_curl_exit_code=$?"
          fi
          echo
          echo "=== Provider/model inventory inspection complete ==="
          # This ephemeral runner starts with a clean user profile. Provider
          # credentials stored on the developer's machine are not available here.
          # Preserve each command's output so empty config/auth issues are visible.

      - name: Upload gateway logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: omniroute-gateway-logs
          path: ${{ runner.temp }}/omniroute.log
          if-no-files-found: ignore
