name: OmniRoute Gateway Validation

on:
  push:
    branches: [audit/omniroute-gateway-validation]
  pull_request:
    branches: [main, master, audit/integrated-hardening]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: omniroute-gateway-${{ github.ref }}
  cancel-in-progress: true

jobs:
  install-and-healthcheck:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Install OmniRoute CLI
        run: |
          node --version
          npm --version
          npm install --global omniroute
          omniroute --version
          omniroute --help

      - name: Start local gateway and wait for readiness
        shell: bash
        run: |
          set -euo pipefail
          omniroute serve --no-open --port 20128 --no-recovery > "$RUNNER_TEMP/omniroute.log" 2>&1 &
          gateway_pid=$!
          cleanup() {
            kill "$gateway_pid" 2>/dev/null || true
            if command -v omniroute >/dev/null 2>&1; then
              omniroute stop >/dev/null 2>&1 || true
            fi
          }
          trap cleanup EXIT

          ready=0
          for attempt in $(seq 1 90); do
            if curl --silent --show-error --fail http://127.0.0.1:20128/healthz > "$RUNNER_TEMP/omniroute-health.txt"; then
              ready=1
              break
            fi
            if ! kill -0 "$gateway_pid" 2>/dev/null; then
              echo "OmniRoute process exited before becoming healthy."
              cat "$RUNNER_TEMP/omniroute.log"
              exit 1
            fi
            sleep 2
          done

          if [ "$ready" -ne 1 ]; then
            echo "OmniRoute did not become healthy within 180 seconds."
            cat "$RUNNER_TEMP/omniroute.log"
            exit 1
          fi

          cat "$RUNNER_TEMP/omniroute-health.txt"
          python - "$RUNNER_TEMP/omniroute-health.txt" <<'PY'
          import json
          import sys
          from pathlib import Path

          raw = Path(sys.argv[1]).read_text(encoding="utf-8").strip()
          try:
              payload = json.loads(raw)
          except json.JSONDecodeError:
              payload = raw

          healthy = payload == "ok" or (
              isinstance(payload, dict) and payload.get("status") == "ok"
          )
          if not healthy:
              raise SystemExit(f"Unexpected OmniRoute health response: {payload!r}")
          print("OmniRoute health endpoint reports healthy status")
          PY

      - name: Inspect configured providers, model catalog, and API surface
        shell: bash
        run: |
          set -uo pipefail
          export OMNIROUTE_BASE_URL="http://127.0.0.1:20128"
          echo "=== CLI command capabilities ==="
          omniroute providers --help || true
          omniroute models --help || true
          omniroute status --help || true
          echo "=== Configured providers (JSON) ==="
          omniroute providers --output json > "$RUNNER_TEMP/omniroute-providers.json" 2>&1
          providers_rc=$?
          cat "$RUNNER_TEMP/omniroute-providers.json"
          echo "providers_exit_code=$providers_rc"
          echo "=== Available models (JSON) ==="
          omniroute models --output json > "$RUNNER_TEMP/omniroute-models.json" 2>&1
          models_rc=$?
          cat "$RUNNER_TEMP/omniroute-models.json"
          echo "models_exit_code=$models_rc"
          echo "=== Gateway status (JSON) ==="
          omniroute status --output json > "$RUNNER_TEMP/omniroute-status.json" 2>&1
          status_rc=$?
          cat "$RUNNER_TEMP/omniroute-status.json"
          echo "status_exit_code=$status_rc"
          echo "=== Doctor diagnostics (JSON) ==="
          omniroute doctor --json > "$RUNNER_TEMP/omniroute-doctor.json" 2>&1
          doctor_rc=$?
          cat "$RUNNER_TEMP/omniroute-doctor.json"
          echo "doctor_exit_code=$doctor_rc"
          echo "=== OpenAI-compatible models endpoint (without credentials) ==="
          curl --silent --show-error --max-time 15 -i \
            http://127.0.0.1:20128/v1/models || true
          echo
          echo "=== Provider/model inventory inspection complete ==="
          # Keep the workflow green for a healthy gateway even when this clean
          # ephemeral runner has no provider credentials/configuration. The
          # captured output distinguishes configured models from an empty catalog.

      - name: Upload gateway logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: omniroute-gateway-logs
          path: ${{ runner.temp }}/omniroute.log
          if-no-files-found: ignore
